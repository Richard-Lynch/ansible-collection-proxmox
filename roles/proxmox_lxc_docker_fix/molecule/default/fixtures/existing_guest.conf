#LXC web %E2%80%94 application server
arch: amd64
cores: 2
features: nesting=1
hostname: web
memory: 4096
mp0: /srv/app-state/web,mp=/mnt/app-state,backup=0
net0: name=eth0,bridge=vmbr0,gw=192.0.2.1,hwaddr=BC:24:11:00:00:0A,ip=dhcp,tag=40,type=veth
onboot: 1
ostype: ubuntu
rootfs: local-lvm:vm-101-disk-0,size=32G
startup: order=210
swap: 1024
tags: ansible;docker
unprivileged: 1
lxc.apparmor.profile: unconfined
lxc.mount.entry: /dev/null sys/module/apparmor/parameters/enabled none bind 0 0
lxc.apparmor.profile: unconfined
lxc.mount.entry: /dev/null sys/module/apparmor/parameters/enabled none bind 0 0
# BEGIN DOCKER APPARMOR WORKAROUND
lxc.apparmor.profile: unconfined
lxc.mount.entry: /dev/null sys/module/apparmor/parameters/enabled none bind 0 0
# END DOCKER APPARMOR WORKAROUND
