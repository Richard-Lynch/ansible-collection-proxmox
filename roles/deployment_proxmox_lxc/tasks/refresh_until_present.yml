---
# One refresh attempt, driven by the loop in create.yml. Separate file because
# `meta: refresh_inventory` cannot be retried in place — it ignores until:/retries:/delay:.
- name: Pause before re-checking the inventory
  ansible.builtin.pause:
    seconds: "{{ utils_verify_connection_delay | int }}"

- name: Refresh the dynamic inventory
  delegate_to: localhost
  ansible.builtin.meta: refresh_inventory
