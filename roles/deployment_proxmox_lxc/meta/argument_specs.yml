                      - tag=<integer> (1 - 4094)
                      - VLAN tag for this interface.
                    type: int
                    required: false
                  trunks:
                    description:
                      - trunks=<vlanid[;vlanid...]>
                      - VLAN ids to pass through the interface
                    type: str
                    required: false
                  type:
                    description:
                      - type=<veth>
                      - Network interface type.
                    type: str
                    required: false
          onboot:
            description:
              - Specifies whether a VM will be started during system bootup.
            type: bool
            required: false
            default: false
          startup:
            description:
              - Controls the order of the startup
              - https://docs.ansible.com/ansible/latest/collections/community/general/proxmox_module.html#parameter-startup
              - 'Use order=# where # is a non-negative number to define the general startup order. Shutdown in done with reverse ordering.'
              - 'Use up=# where # is in seconds, to specify a delay to wait before the next VM is started.'
              - 'Use down=# where # is in seconds, to specify a delay to wait before the next VM is stopped.'
            type: dict
            required: false
            options:
              order:
                description: non-negative number to define the general startup order. Shutdown in done with reverse ordering.
                type: int
                required: false
              up:
                description: seconds, to specify a delay to wait before the next VM is started.
                type: int
                required: false
              down:
                description: seconds, to specify a delay to wait before the next VM is stopped.
                type: int
                required: false
          features:
            description:
              - See https://pve.proxmox.com/wiki/Linux_Container
              - 'features: [force_rw_sys=<1|0>] [,fuse=<1|0>] [,keyctl=<1|0>] [,mknod=<1|0>] [,mount=<fstype;fstype;...>] [,nesting=<1|0>]'
            type: dict
            required: true
            options:
              force_rw_sys:
                type: int
                required: false
                choices:
                  - 0
                  - 1
              fuse:
                type: int
                required: false
                choices:
                  - 0
                  - 1
              keyctl:
                type: int
                required: false
                choices:
                  - 0
                  - 1
              mknod:
                type: int
                required: false
                choices:
                  - 0
                  - 1
              nesting:
                type: int
                required: false
                choices:
                  - 0
                  - 1
              mount:
                type: str
                required: false
          cores:
            type: int
            required: false
            default: 4
          memory_mb:
            type: int
            required: false
            default: 2048
          swap_mb:
            type: int
            required: false
            default: 1024
          storage_gb:
            type: int
            required: false
            default: 8
          storage:
            type: str
            required: false
            default: local-lvm
            choices:
              - local
              - local-lvm
          tags:
            type: list
            required: false
            default:
              - ansible
            elements: str
