# Offline scenario — exercises the role's OWN netif transform and asserts on the output.
#
# NO PROXMOX IS TOUCHED. Only tasks/set_vars.yml is included, which is pure computation: it
# renders the netif dict into PVE's `k=v,k=v` strings and sets facts. Nothing is created, no API
# is called, and no credential is needed.
---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: localhost
provisioner:
  name: ansible
  # Molecule runs from the scenario directory, so the repo's ansible.cfg roles_path (./roles) does
  # not resolve. Pointed at the repo root so converge.yml can include the role under test.
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
    # Dependencies (galaxy.yml) are installed into collections.galaxy/ at the repo root; the
    # second entry resolves this collection itself when the checkout sits at
    # ansible_collections/richard_lynch/proxmox. molecule does not read a repo ansible.cfg.
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections.galaxy:${MOLECULE_PROJECT_DIRECTORY}/../../../../.."
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence: [syntax, converge, verify, idempotence]
