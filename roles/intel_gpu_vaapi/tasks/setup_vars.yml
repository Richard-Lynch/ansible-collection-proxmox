---
# Resolve caller-supplied vars over the generated defaults.

- name: Assert the device id was supplied
  ansible.builtin.assert:
    that:
      - vaapi_device_id is defined
      - vaapi_device_id is match('^[0-9a-fA-F]{4}:[0-9a-fA-F]{4}$')
    fail_msg: >-
      intel_gpu_vaapi requires vaapi_device_id as a PCI vendor:device pair, e.g. '8086:e20c'.
      Got: '{{ vaapi_device_id | default('(undefined)') }}'.
    success_msg: "Target GPU: {{ vaapi_device_id }}"
    quiet: true

- name: Resolve defaults
  ansible.builtin.set_fact:
    vaapi_apply: "{{ vaapi_apply | default(vaapi_apply__default) }}"
    vaapi_packages: "{{ vaapi_packages | default(vaapi_packages__default) }}"
    vaapi_backports_suite: "{{ vaapi_backports_suite | default(vaapi_backports_suite__default) }}"
    vaapi_stable_suite: "{{ vaapi_stable_suite | default(vaapi_stable_suite__default) }}"
    vaapi_backports_filename: "{{ vaapi_backports_filename | default(vaapi_backports_filename__default) }}"
    # Overridable ONLY so molecule can point the role at a fixture sysfs tree; production never
    # sets it.
    vaapi_sysfs_base: "{{ vaapi_sysfs_base | default(vaapi_sysfs_base__default) }}"
