---
# AUTO-GENERATED defaults resolver — DO NOT EDIT.
#
# Source of truth: roles/vm_homeassistant/meta/argument_specs.py
# Regenerate:      venv/bin/python tools/argspec/cli.py x generate vm_homeassistant
#
# Edits here are silently overwritten on the next generation. To change a value or its
# documentation, change the OptionSpec in the source file above — descriptions there
# are emitted as the comments in this file.

# Binds every declared option to its generated default, so a caller-supplied value
# wins and an unsupplied one falls back rather than evaluating Undefined.
#
# Include this FIRST from every entrypoint:
#   - ansible.builtin.include_tasks: _resolve_defaults.yml
#
# Role-specific setup logic belongs in tasks/setup_vars.yml, NOT here — this file is
# overwritten on every generation.
#
# TWO BRANCHES, because `set_fact` persists for the whole play. A role invoked twice in
# one play would otherwise see its OWN leftover facts on the second call, so a later
# caller that omitted an option silently inherited the earlier caller's value instead of
# the declared default. On a repeat call this ignores the role's own facts and rebinds
# the defaults; an include-level `vars:` shadows the fact, so a value the caller DID
# supply this time still wins. Roles called once per play only ever run the first branch.

- name: Resolve declared options over their generated defaults
  ansible.builtin.set_fact:
    homeassistant_vm_name: "{{ homeassistant_vm_name | default(homeassistant_vm_name__default) if homeassistant_vm_name__default is defined else homeassistant_vm_name | default(omit) }}"
    homeassistant_vm_bridge: "{{ homeassistant_vm_bridge | default(homeassistant_vm_bridge__default) if homeassistant_vm_bridge__default is defined else homeassistant_vm_bridge | default(omit) }}"
    homeassistant_vm_cores: "{{ homeassistant_vm_cores | default(homeassistant_vm_cores__default) if homeassistant_vm_cores__default is defined else homeassistant_vm_cores | default(omit) }}"
    homeassistant_vm_memory: "{{ homeassistant_vm_memory | default(homeassistant_vm_memory__default) if homeassistant_vm_memory__default is defined else homeassistant_vm_memory | default(omit) }}"
    homeassistant_vm_storage: "{{ homeassistant_vm_storage | default(homeassistant_vm_storage__default) if homeassistant_vm_storage__default is defined else homeassistant_vm_storage | default(omit) }}"
    homeassistant_vm_disk_size: "{{ homeassistant_vm_disk_size | default(homeassistant_vm_disk_size__default) if homeassistant_vm_disk_size__default is defined else homeassistant_vm_disk_size | default(omit) }}"
  when: not (_vm_homeassistant__argspec_resolved | default(false))

- name: Rebind the defaults on a repeat call, ignoring this role's own leftover facts
  ansible.builtin.set_fact:
    homeassistant_vm_name: "{{ homeassistant_vm_name__default if homeassistant_vm_name__default is defined else homeassistant_vm_name | default(omit) }}"
    homeassistant_vm_bridge: "{{ homeassistant_vm_bridge__default if homeassistant_vm_bridge__default is defined else homeassistant_vm_bridge | default(omit) }}"
    homeassistant_vm_cores: "{{ homeassistant_vm_cores__default if homeassistant_vm_cores__default is defined else homeassistant_vm_cores | default(omit) }}"
    homeassistant_vm_memory: "{{ homeassistant_vm_memory__default if homeassistant_vm_memory__default is defined else homeassistant_vm_memory | default(omit) }}"
    homeassistant_vm_storage: "{{ homeassistant_vm_storage__default if homeassistant_vm_storage__default is defined else homeassistant_vm_storage | default(omit) }}"
    homeassistant_vm_disk_size: "{{ homeassistant_vm_disk_size__default if homeassistant_vm_disk_size__default is defined else homeassistant_vm_disk_size | default(omit) }}"
  when: _vm_homeassistant__argspec_resolved | default(false)

- name: Record that this role has resolved its options in this play
  ansible.builtin.set_fact:
    _vm_homeassistant__argspec_resolved: true
