---
# https://docs.ansible.com/ansible/latest/collections/community/general/proxmox_kvm_module.html#parameter-ciupgrade
- name: Clone VM from cloud-init template
  register: vm_result
  community.general.proxmox_kvm:
    # Proxmox
    api_host: "{{ proxmox.api_host }}"
    api_user: "{{ proxmox.user }}"
    api_token_id: "{{ proxmox.api_token_id }}"
    api_token_secret: "{{ proxmox.api_token_secret }}"
    # Location
    node: "{{ proxmox.node }}"
    newid: "{{ deployment_proxmox_vm_machine__.vmid }}"
    name: "{{ deployment_proxmox_vm_machine__.name }}"
    storage: "{{ deployment_proxmox_vm_machine__.storage_target }}"
    # Action
    clone: "{{ deployment_proxmox_vm_template_name }}"

- name: Grow VM disk
  community.general.proxmox_disk:
    # Proxmox
    api_host: "{{ proxmox.api_host }}"
    api_user: "{{ proxmox.user }}"
    api_token_id: "{{ proxmox.api_token_id }}"
    api_token_secret: "{{ proxmox.api_token_secret }}"
    # Location
    name: "{{ deployment_proxmox_vm_machine__.name }}"
    vmid: "{{ deployment_proxmox_vm_machine__.vmid }}"
    # Action
    size: "{{ deployment_proxmox_vm_machine__.size }}"
    disk: scsi0
    state: resized

- name: Show
  ansible.builtin.debug:
    var: deployment_proxmox_vm_machine__.ipconfig.ipconfig0

- name: Update VM configuration
  community.general.proxmox_kvm:
    # Proxmox
    node: "{{ proxmox.node }}"
    api_host: "{{ proxmox.api_host }}"
    api_user: "{{ proxmox.user }}"
    api_token_id: "{{ proxmox.api_token_id }}"
    api_token_secret: "{{ proxmox.api_token_secret }}"
    # Location
    name: "{{ deployment_proxmox_vm_machine__.name }}"
    vmid: "{{ deployment_proxmox_vm_machine__.vmid }}"
    # Set N
    cores: "{{ deployment_proxmox_vm_machine__.cores }}"
    memory: "{{ deployment_proxmox_vm_machine__.memory }}"
    agent: 1
    ipconfig:
      ipconfig0: "{{ deployment_proxmox_vm_machine__.ipconfig.ipconfig0.items() | map('join', '=') | join(',') }}"
    ciuser: "{{ deployment_proxmox_vm_ci__.user }}"
    cipassword: "{{ deployment_proxmox_vm_ci__.password }}"
    sshkeys: "{{ public_ssh_key }}"
    tags: "{{ deployment_proxmox_vm_machine__.tags }}"
    # Action
    update: true

- name: Get current status of VM
  register: deployment_proxmox_vm__vm_info
  community.general.proxmox_vm_info:
    # Proxmox
    node: "{{ proxmox.node }}"
    api_host: "{{ proxmox.api_host }}"
    api_user: "{{ proxmox.user }}"
    api_token_id: "{{ proxmox.api_token_id }}"
    api_token_secret: "{{ proxmox.api_token_secret }}"
    type: qemu
    vmid: "{{ deployment_proxmox_vm_machine__.vmid }}"
  ignore_errors: true

- name: Set current status of VM
  ansible.builtin.set_fact:
    deployment_proxmox_vm__current_status: "{{ deployment_proxmox_vm__vm_info.proxmox_vms[0].status | default('unknown') }}"

- name: Set desired state on current_status={{ deployment_proxmox_vm__current_status }}
  ansible.builtin.set_fact:
    deployment_proxmox_vm__desired_state: "{{ ((deployment_proxmox_vm__current_status != 'running') | ternary('started', 'restarted', 'started')) }}"

- name: Start VM
  register: start_st
  community.general.proxmox_kvm:
    # Proxmox
    api_host: "{{ proxmox.api_host }}"
    api_user: "{{ proxmox.user }}"
    api_token_id: "{{ proxmox.api_token_id }}"
    api_token_secret: "{{ proxmox.api_token_secret }}"
    # Location
    node: "{{ proxmox.node }}"
    vmid: "{{ deployment_proxmox_vm_machine__.vmid }}"
    # Action
    state: "{{ deployment_proxmox_vm__desired_state }}"
